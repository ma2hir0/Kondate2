<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夕食ログ＆献立アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-20">

    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🍽️</span> 夕食ログ＆献立
        </h1>
        <span class="text-xs bg-indigo-700 px-2 py-1 rounded">自分専用</span>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- 1. ホーム（記録・編集） -->
        <section id="tab-home" class="tab-content space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 id="form-title" class="text-lg font-bold mb-3 flex items-center gap-2 text-indigo-900">
                    <span>✍️</span> 今日の夕食を記録
                </h2>
                <form id="dinner-form" class="space-y-4">
                    <input type="hidden" id="edit-id" value="">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">日付</label>
                        <input type="date" id="input-date" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">メイン料理名</label>
                        <input type="text" id="input-menu" placeholder="例：ハンバーグ、生姜焼き" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ</label>
                            <select id="input-category" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="和食">和食</option>
                                <option value="洋食">洋食</option>
                                <option value="中華">中華</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">メイン食材</label>
                            <select id="input-type" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="肉">肉</option>
                                <option value="魚">魚</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">メモ・副菜など</label>
                        <input type="text" id="input-memo" placeholder="例：味噌汁、サラダ" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-sm transition">
                            保存する
                        </button>
                        <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-3 rounded-xl text-sm transition">
                            キャンセル
                        </button>
                    </div>
                </form>
            </div>

            <div>
                <h3 class="text-sm font-bold text-gray-500 mb-3 px-1">最近の夕食ログ</h3>
                <div id="recent-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- 2. 月単位カレンダー -->
        <section id="tab-calendar" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 text-indigo-600 font-bold hover:bg-indigo-50 rounded-lg">＜ 前月</button>
                    <h2 id="calendar-month-title" class="text-base font-bold text-gray-800">---</h2>
                    <button onclick="changeMonth(1)" class="p-2 text-indigo-600 font-bold hover:bg-indigo-50 rounded-lg">次月 ＞</button>
                </div>

                <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-2">
                    <div class="text-red-500">日</div>
                    <div>月</div>
                    <div>火</div>
                    <div>水</div>
                    <div>木</div>
                    <div>金</div>
                    <div class="text-blue-500">土</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>
        </section>

        <!-- 3. 献立ガチャ -->
        <section id="tab-gacha" class="tab-content hidden space-y-6">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-6 rounded-2xl shadow-md text-center space-y-4">
                <div class="text-4xl">🎲</div>
                <h2 class="text-xl font-bold">今夜の献立ガチャ</h2>
                <p class="text-xs text-indigo-100">過去のデータからランダム提案！</p>
                <button id="btn-gacha" class="bg-white text-indigo-600 font-bold px-6 py-3 rounded-full text-sm shadow-lg hover:bg-indigo-50 active:scale-95 transition transform">
                    献立を提案してもらう！
                </button>
            </div>
            <div id="gacha-result" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center space-y-3">
                <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">本日のおすすめ</span>
                <h3 id="gacha-title" class="text-2xl font-bold text-gray-800">---</h3>
                <p id="gacha-sub" class="text-xs text-gray-500">---</p>
            </div>
        </section>

        <!-- 4. 統計 -->
        <section id="tab-stats" class="tab-content hidden space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h2 class="text-base font-bold text-gray-700">肉 vs 魚 の割合</h2>
                <div class="w-48 mx-auto">
                    <canvas id="chart-main"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- モーダルポップアップ（詳細・編集・削除用） -->
    <div id="modal" class="fixed inset-0 bg-black/40 hidden z-20 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-start">
                <div>
                    <div id="modal-date" class="text-xs text-gray-400">2026-10-01</div>
                    <h3 id="modal-title" class="text-lg font-bold text-gray-800">ハンバーグ</h3>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
            </div>
            <div id="modal-body" class="text-sm text-gray-600 space-y-1"></div>
            <div class="flex gap-2 pt-2 border-t">
                <button id="modal-btn-edit" class="flex-1 bg-indigo-50 text-indigo-600 font-bold py-2 rounded-xl text-xs hover:bg-indigo-100 transition">✏️ 修正する</button>
                <button id="modal-btn-delete" class="flex-1 bg-red-50 text-red-600 font-bold py-2 rounded-xl text-xs hover:bg-red-100 transition">🗑️ 削除する</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 text-xs text-gray-500 z-10">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-indigo-600 font-bold">
            <span class="text-lg">🏠</span>
            <span>記録</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center gap-1">
            <span class="text-lg">📅</span>
            <span>カレンダー</span>
        </button>
        <button onclick="switchTab('gacha')" id="nav-gacha" class="flex flex-col items-center gap-1">
            <span class="text-lg">🎲</span>
            <span>ガチャ</span>
        </button>
        <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-1">
            <span class="text-lg">📊</span>
            <span>分析</span>
        </button>
    </nav>

    <script>
        let currentDate = new Date();
        let logs = JSON.parse(localStorage.getItem('dinner_logs')) || [
            { id: 1, date: '2026-10-01', menu: 'ハンバーグ', category: '洋食', type: '肉', memo: 'コンソメスープ' },
            { id: 2, date: '2026-10-02', menu: '鯖の塩焼き', category: '和食', type: '魚', memo: '豚汁、豆腐' }
        ];

        document.getElementById('input-date').valueAsDate = new Date();

        function saveLogs() {
            localStorage.setItem('dinner_logs', JSON.stringify(logs));
            renderList();
            renderCalendar();
            updateChart();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-indigo-600', 'font-bold');
                el.classList.add('text-gray-500');
            });
            document.getElementById(`nav-${tabName}`).classList.add('text-indigo-600', 'font-bold');
            if(tabName === 'calendar') renderCalendar();
        }

        // フォーム保存・更新処理
        document.getElementById('dinner-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const dateVal = document.getElementById('input-date').value;
            const menuVal = document.getElementById('input-menu').value;
            const catVal = document.getElementById('input-category').value;
            const typeVal = document.getElementById('input-type').value;
            const memoVal = document.getElementById('input-memo').value;

            if (editId) {
                // 編集（更新）
                const targetLog = logs.find(l => l.id == editId);
                if (targetLog) {
                    targetLog.date = dateVal;
                    targetLog.menu = menuVal;
                    targetLog.category = catVal;
                    targetLog.type = typeVal;
                    targetLog.memo = memoVal;
                }
                alert('修正したよ！');
            } else {
                // 新規作成
                const newLog = {
                    id: Date.now(),
                    date: dateVal,
                    menu: menuVal,
                    category: catVal,
                    type: typeVal,
                    memo: memoVal
                };
                logs.unshift(newLog);
                alert('保存したよ！');
            }

            // 日付順に並び替え
            logs.sort((a, b) => new Date(b.date) - new Date(a.date));

            saveLogs();
            resetForm();
        });

        // フォームリセット
        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('input-menu').value = '';
            document.getElementById('input-memo').value = '';
            document.getElementById('input-date').valueAsDate = new Date();
            document.getElementById('form-title').innerHTML = '<span>✍️</span> 今日の夕食を記録';
            document.getElementById('btn-submit').textContent = '保存する';
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        // 編集モード呼出
        function editLog(id) {
            const log = logs.find(l => l.id == id);
            if (!log) return;

            document.getElementById('edit-id').value = log.id;
            document.getElementById('input-date').value = log.date;
            document.getElementById('input-menu').value = log.menu;
            document.getElementById('input-category').value = log.category;
            document.getElementById('input-type').value = log.type;
            document.getElementById('input-memo').value = log.memo || '';

            document.getElementById('form-title').innerHTML = '<span>✏️</span> 夕食ログを修正';
            document.getElementById('btn-submit').textContent = '修正を保存';
            document.getElementById('btn-cancel').classList.remove('hidden');

            closeModal();
            switchTab('home');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ログ削除
        function deleteLog(id) {
            if (confirm('このログを削除してもいい？')) {
                logs = logs.filter(l => l.id != id);
                saveLogs();
                closeModal();
                alert('削除したよ！');
            }
        }

        // ログ一覧描画
        function renderList() {
            const listEl = document.getElementById('recent-list');
            listEl.innerHTML = '';
            logs.slice(0, 5).forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
                card.innerHTML = `
                    <div class="cursor-pointer flex-1" onclick="openModal(${item.id})">
                        <div class="text-xs text-gray-400 mb-0.5">${item.date}</div>
                        <div class="font-bold text-gray-800 text-sm">${item.menu}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">${item.category}</span>
                        <button onclick="editLog(${item.id})" class="text-xs text-indigo-500 hover:text-indigo-700 p-1">✏️️</button>
                        <button onclick="deleteLog(${item.id})" class="text-xs text-red-400 hover:text-red-600 p-1">🗑️</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // カレンダー画面描画
        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendar-month-title').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const log = logs.find(l => l.date === dateStr);
                const cell = document.createElement('div');
                cell.className = 'border border-gray-100 p-1 min-h-[50px] rounded-lg bg-white flex flex-col justify-between items-center text-xs cursor-pointer hover:bg-gray-50';
                
                cell.innerHTML = `<span class="font-bold ${log ? 'text-indigo-600' : 'text-gray-600'}">${day}</span>`;
                if (log) {
                    cell.innerHTML += `<div class="text-[10px] bg-indigo-50 text-indigo-700 rounded px-1 w-full truncate mt-1">${log.menu}</div>`;
                    cell.onclick = () => openModal(log.id);
                } else {
                    cell.onclick = () => {
                        document.getElementById('input-date').value = dateStr;
                        switchTab('home');
                    };
                }
                grid.appendChild(cell);
            }
        }

        // モーダル表示
        function openModal(id) {
            const log = logs.find(l => l.id == id);
            if (!log) return;

            document.getElementById('modal-date').textContent = log.date;
            document.getElementById('modal-title').textContent = log.menu;
            document.getElementById('modal-body').innerHTML = `
                <p>カテゴリ: <span class="font-semibold text-gray-700">${log.category} (${log.type})</span></p>
                <p>メモ: <span class="font-semibold text-gray-700">${log.memo || 'なし'}</span></p>
            `;
            document.getElementById('modal-btn-edit').onclick = () => editLog(log.id);
            document.getElementById('modal-btn-delete').onclick = () => deleteLog(log.id);
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // ガチャ
        document.getElementById('btn-gacha').addEventListener('click', () => {
            if (logs.length === 0) return alert('まだデータがないよ！');
            const randomItem = logs[Math.floor(Math.random() * logs.length)];
            document.getElementById('gacha-title').textContent = randomItem.menu;
            document.getElementById('gacha-sub').textContent = `${randomItem.category} / ${randomItem.type}`;
            document.getElementById('gacha-result').classList.remove('hidden');
        });

        // グラフ
        let chart;
        function updateChart() {
            const counts = { 肉: 0, 魚: 0, その他: 0 };
            logs.forEach(item => counts[item.type] = (counts[item.type] || 0) + 1);
            const ctx = document.getElementById('chart-main').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['肉', '魚', 'その他'],
                    datasets: [{ data: [counts['肉'], counts['魚'], counts['その他']], backgroundColor: ['#F87171', '#60A5FA', '#9CA3AF'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });
        }

        renderList();
        updateChart();
    </script>
</body>
</html>
