<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夕食ログ＆献立アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-20">

    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🍽️</span> 夕食ログ＆献立
        </h1>
        <span class="text-xs bg-indigo-700 px-2 py-1 rounded">自分専用</span>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- 1. 月単位カレンダー（メイン画面） -->
        <section id="tab-calendar" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 text-indigo-600 font-bold hover:bg-indigo-50 rounded-lg">＜ 前月</button>
                    <h2 id="calendar-month-title" class="text-base font-bold text-gray-800">---</h2>
                    <button onclick="changeMonth(1)" class="p-2 text-indigo-600 font-bold hover:bg-indigo-50 rounded-lg">次月 ＞</button>
                </div>

                <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-2">
                    <div class="text-red-500">日</div>
                    <div>月</div>
                    <div>火</div>
                    <div>水</div>
                    <div>木</div>
                    <div>金</div>
                    <div class="text-blue-500">土</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <!-- 最近の記録一覧 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-xs font-bold text-gray-400 mb-3 px-1">最近の夕食ログ</h3>
                <div id="recent-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. 献立ガチャ（候補3つ＆確実な画像表示） -->
        <section id="tab-gacha" class="tab-content hidden space-y-6">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-6 rounded-2xl shadow-md text-center space-y-3">
                <div class="text-4xl">🎲</div>
                <h2 class="text-xl font-bold">今夜の献立ガチャ</h2>
                <p class="text-xs text-indigo-100">過去のデータからおすすめ候補を3つ提案！</p>
                <button id="btn-gacha" class="bg-white text-indigo-600 font-bold px-6 py-3 rounded-full text-sm shadow-lg hover:bg-indigo-50 active:scale-95 transition transform mt-2">
                    献立候補を3つ選ぶ！
                </button>
            </div>

            <div id="gacha-result" class="hidden space-y-4">
                <h3 class="text-xs font-bold text-gray-400 px-1">今夜のおすすめ候補 3選</h3>
                <div id="gacha-cards" class="space-y-3"></div>
            </div>
        </section>

        <!-- 3. 統計 -->
        <section id="tab-stats" class="tab-content hidden space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h2 class="text-base font-bold text-gray-700">肉 vs 魚 の割合</h2>
                <div class="w-48 mx-auto">
                    <canvas id="chart-main"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- モーダル（①確認ポップアップ） -->
    <div id="modal-view" class="fixed inset-0 bg-black/40 hidden z-20 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2">
                <div>
                    <span id="view-date" class="text-sm font-bold text-gray-800">2026-10-01</span>
                    <span class="text-xs text-gray-400 block">の記録</span>
                </div>
                <button onclick="closeModal('modal-view')" class="text-gray-400 hover:text-gray-600 text-lg p-1">✕</button>
            </div>
            
            <div id="view-list" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>

            <button onclick="openFormForNew()" class="w-full bg-indigo-50 text-indigo-600 font-bold py-2.5 rounded-xl text-xs hover:bg-indigo-100 transition">
                ＋ 新しい記録を追加
            </button>
        </div>
    </div>

    <!-- モーダル（②入力・編集フォーム） -->
    <div id="modal-form" class="fixed inset-0 bg-black/40 hidden z-30 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="form-title" class="text-base font-bold text-gray-800">夕食を入力</h3>
                <button onclick="closeModal('modal-form')" class="text-gray-400 hover:text-gray-600 text-lg p-1">✕</button>
            </div>

            <form id="dinner-form" class="space-y-3">
                <input type="hidden" id="edit-id" value="">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">日付</label>
                    <input type="date" id="input-date" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">メイン料理名</label>
                    <input type="text" id="input-menu" placeholder="例：ハンバーグ、照り焼きチキン" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ</label>
                        <select id="input-category" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="和食">和食</option>
                            <option value="洋食">洋食</option>
                            <option value="中華">中華</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">メイン食材</label>
                        <select id="input-type" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="肉">肉</option>
                            <option value="魚">魚</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">メモ・副菜など</label>
                    <input type="text" id="input-memo" placeholder="例：味噌汁、サラダ" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-sm transition">
                    保存する
                </button>
            </form>
        </div>
    </div>

    <!-- ボトムナビ -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 text-xs text-gray-500 z-10">
        <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center gap-1 text-indigo-600 font-bold">
            <span class="text-lg">📅</span>
            <span>カレンダー</span>
        </button>
        <button onclick="switchTab('gacha')" id="nav-gacha" class="flex flex-col items-center gap-1">
            <span class="text-lg">🎲</span>
            <span>ガチャ</span>
        </button>
        <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-1">
            <span class="text-lg">📊</span>
            <span>分析</span>
        </button>
    </nav>

    <script>
        let currentDate = new Date();
        let selectedDateStr = '';
        let logs = JSON.parse(localStorage.getItem('dinner_logs')) || [
            { id: 1, date: '2026-10-01', menu: 'ハンバーグ', category: '洋食', type: '肉', memo: 'コンソメスープ' },
            { id: 2, date: '2026-10-02', menu: '鯖の塩焼き', category: '和食', type: '魚', memo: '豚汁、豆腐' },
            { id: 3, date: '2026-10-03', menu: '照り焼きチキン', category: '和食', type: '肉', memo: 'サラダ' }
        ];

        function saveLogs() {
            localStorage.setItem('dinner_logs', JSON.stringify(logs));
            renderCalendar();
            renderRecentList();
            updateChart();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-indigo-600', 'font-bold');
                el.classList.add('text-gray-500');
            });
            document.getElementById(`nav-${tabName}`).classList.add('text-indigo-600', 'font-bold');
            if(tabName === 'calendar') renderCalendar();
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendar-month-title').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLogs = logs.filter(l => l.date === dateStr);
                const cell = document.createElement('div');
                cell.className = 'border border-gray-100 p-1 min-h-[52px] rounded-lg bg-white flex flex-col justify-between items-center text-xs cursor-pointer hover:bg-gray-50 transition';
                
                cell.innerHTML = `<span class="font-bold ${dayLogs.length > 0 ? 'text-indigo-600' : 'text-gray-600'}">${day}</span>`;
                if (dayLogs.length > 0) {
                    const extraCount = dayLogs.length > 1 ? ` (+${dayLogs.length - 1})` : '';
                    cell.innerHTML += `<div class="text-[10px] bg-indigo-50 text-indigo-700 rounded px-1 w-full truncate mt-1">${dayLogs[0].menu}${extraCount}</div>`;
                }
                cell.onclick = () => handleDateClick(dateStr);
                grid.appendChild(cell);
            }
        }

        function handleDateClick(dateStr) {
            selectedDateStr = dateStr;
            const dayLogs = logs.filter(l => l.date === dateStr);
            if (dayLogs.length === 0) {
                openFormForNew();
            } else {
                openViewModal(dateStr);
            }
        }

        function openViewModal(dateStr) {
            document.getElementById('view-date').textContent = dateStr;
            const dayLogs = logs.filter(l => l.date === dateStr);
            const listEl = document.getElementById('view-list');
            listEl.innerHTML = '';

            dayLogs.forEach(log => {
                const item = document.createElement('div');
                item.className = 'bg-gray-50 p-3 rounded-xl space-y-2 border border-gray-100';
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-gray-800 text-sm">${log.menu}</div>
                            <div class="text-xs text-gray-500 mt-0.5">${log.category} / ${log.type}</div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="openFormForEdit(${log.id})" class="text-xs bg-white text-indigo-600 border border-indigo-200 px-2 py-1 rounded-lg hover:bg-indigo-50">✏️️ 修正</button>
                            <button onclick="deleteLog(${log.id})" class="text-xs bg-white text-red-600 border border-red-200 px-2 py-1 rounded-lg hover:bg-red-50">🗑️ 削除</button>
                        </div>
                    </div>
                    ${log.memo ? `<div class="text-xs text-gray-600 bg-white p-2 rounded-lg border border-gray-100">メモ: ${log.memo}</div>` : ''}
                `;
                listEl.appendChild(item);
            });

            document.getElementById('modal-view').classList.remove('hidden');
        }

        function openFormForNew() {
            closeModal('modal-view');
            document.getElementById('edit-id').value = '';
            document.getElementById('input-date').value = selectedDateStr;
            document.getElementById('input-menu').value = '';
            document.getElementById('input-memo').value = '';
            document.getElementById('form-title').textContent = `${selectedDateStr} の入力`;
            document.getElementById('modal-form').classList.remove('hidden');
        }

        function openFormForEdit(id) {
            closeModal('modal-view');
            const log = logs.find(l => l.id == id);
            if (!log) return;

            document.getElementById('edit-id').value = log.id;
            document.getElementById('input-date').value = log.date;
            document.getElementById('input-menu').value = log.menu;
            document.getElementById('input-category').value = log.category;
            document.getElementById('input-type').value = log.type;
            document.getElementById('input-memo').value = log.memo || '';
            document.getElementById('form-title').textContent = '記録を修正';
            document.getElementById('modal-form').classList.remove('hidden');
        }

        document.getElementById('dinner-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const dateVal = document.getElementById('input-date').value;
            const menuVal = document.getElementById('input-menu').value;
            const catVal = document.getElementById('input-category').value;
            const typeVal = document.getElementById('input-type').value;
            const memoVal = document.getElementById('input-memo').value;

            if (editId) {
                const targetLog = logs.find(l => l.id == editId);
                if (targetLog) {
                    targetLog.date = dateVal;
                    targetLog.menu = menuVal;
                    targetLog.category = catVal;
                    targetLog.type = typeVal;
                    targetLog.memo = memoVal;
                }
            } else {
                logs.unshift({
                    id: Date.now(),
                    date: dateVal,
                    menu: menuVal,
                    category: catVal,
                    type: typeVal,
                    memo: memoVal
                });
            }

            logs.sort((a, b) => new Date(b.date) - new Date(a.date));
            saveLogs();
            closeModal('modal-form');
        });

        function deleteLog(id) {
            if (confirm('このログを削除してもいい？')) {
                logs = logs.filter(l => l.id != id);
                saveLogs();
                const remaining = logs.filter(l => l.date === selectedDateStr);
                if (remaining.length > 0) {
                    openViewModal(selectedDateStr);
                } else {
                    closeModal('modal-view');
                }
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function renderRecentList() {
            const listEl = document.getElementById('recent-list');
            listEl.innerHTML = '';
            logs.slice(0, 3).forEach(item => {
                const card = document.createElement('div');
                card.className = 'flex justify-between items-center text-xs p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100';
                card.onclick = () => handleDateClick(item.date);
                card.innerHTML = `
                    <div>
                        <span class="text-gray-400 mr-2">${item.date}</span>
                        <span class="font-bold text-gray-800">${item.menu}</span>
                    </div>
                    <span class="bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded text-[10px]">${item.category}</span>
                `;
                listEl.appendChild(card);
            });
        }

        // 確実かつ高画質な料理テーマ別写真集（直リンク）
        const foodImages = {
            hamburg: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&auto=format&fit=crop&q=80',
            chicken: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400&auto=format&fit=crop&q=80',
            steak: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&auto=format&fit=crop&q=80',
            fish: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=400&auto=format&fit=crop&q=80',
            sushi: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=400&auto=format&fit=crop&q=80',
            pasta: 'https://images.unsplash.com/photo-1621996346565-e3d5d6288331?w=400&auto=format&fit=crop&q=80',
            curry: 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&auto=format&fit=crop&q=80',
            noodle: 'https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=400&auto=format&fit=crop&q=80',
            chinese: 'https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?w=400&auto=format&fit=crop&q=80',
            japanese: 'https://images.unsplash.com/photo-1580822184713-fc5400e7fe10?w=400&auto=format&fit=crop&q=80',
            default: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&auto=format&fit=crop&q=80'
        };

        // 料理名やカテゴリから最適な画像を割り当てる
        function getStableFoodImage(menuName, category, type) {
            const name = menuName.toLowerCase();

            if (name.includes('ハンバーグ') || name.includes('ピーマン')) return foodImages.hamburg;
            if (name.includes('チキン') || name.includes('唐揚げ') || name.includes('照り焼き')) return foodImages.chicken;
            if (name.includes('ステーキ') || name.includes('焼肉') || name.includes('牛丼') || name.includes('カツ丼')) return foodImages.steak;
            if (name.includes('鯖') || name.includes('さば') || name.includes('鮭') || name.includes('魚')) return foodImages.fish;
            if (name.includes('刺身') || name.includes('寿司') || name.includes('すし')) return foodImages.sushi;
            if (name.includes('パスタ') || name.includes('スパゲティ') || name.includes('ミートスパ')) return foodImages.pasta;
            if (name.includes('カレー') || name.includes('シチュー')) return foodImages.curry;
            if (name.includes('うどん') || name.includes('ラーメン') || name.includes('冷やし中華') || name.includes('そば')) return foodImages.noodle;
            if (name.includes('麻婆') || name.includes('餃子') || category === '中華') return foodImages.chinese;

            if (type === '魚') return foodImages.fish;
            if (type === '肉') return foodImages.steak;
            if (category === '和食') return foodImages.japanese;

            return foodImages.default;
        }

        // ガチャ（候補3件抽出＋画像表示）
        document.getElementById('btn-gacha').addEventListener('click', () => {
            if (logs.length === 0) return alert('まだデータがないよ！');

            const uniqueLogs = Array.from(new Set(logs.map(l => l.menu)))
                .map(menu => logs.find(l => l.menu === menu));

            const shuffled = [...uniqueLogs].sort(() => 0.5 - Math.random());
            const selectedCandidates = shuffled.slice(0, 3);

            const cardsContainer = document.getElementById('gacha-cards');
            cardsContainer.innerHTML = '';

            selectedCandidates.forEach((item, index) => {
                const imgUrl = getStableFoodImage(item.menu, item.category, item.type);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm flex items-center p-3 gap-3';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${item.menu}" 
                         onerror="this.src='${foodImages.default}';"
                         class="w-20 h-20 object-cover rounded-xl bg-gray-100 flex-shrink-0">
                    <div class="flex-1">
                        <span class="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">候補 ${index + 1}</span>
                        <h4 class="font-bold text-gray-800 text-base mt-1">${item.menu}</h4>
                        <div class="text-xs text-gray-500 mt-0.5">${item.category} / ${item.type}</div>
                        ${item.memo ? `<div class="text-[10px] text-gray-400 mt-1 truncate">メモ: ${item.memo}</div>` : ''}
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            document.getElementById('gacha-result').classList.remove('hidden');
        });

        // グラフ
        let chart;
        function updateChart() {
            const counts = { 肉: 0, 魚: 0, その他: 0 };
            logs.forEach(item => counts[item.type] = (counts[item.type] || 0) + 1);
            const ctx = document.getElementById('chart-main').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['肉', '魚', 'その他'],
                    datasets: [{ data: [counts['肉'], counts['魚'], counts['その他']], backgroundColor: ['#F87171', '#60A5FA', '#9CA3AF'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });
        }

        // 初期表示
        renderCalendar();
        renderRecentList();
        updateChart();
    </script>
</body>
</html>
